<!doctype html><body style="margin:0;background:transparent"><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"/r/node_modules/three/build/three.module.js","three/addons/":"/r/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search), char=q.get('char')||'player', S=+(q.get('size')||200), yaw=+(q.get('yaw')||1.15);
const cv=document.getElementById('c'); cv.width=S; cv.height=S;
const r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true,preserveDrawingBuffer:true}); r.setSize(S,S,false); r.setClearColor(0,0);
r.outputColorSpace=THREE.SRGBColorSpace; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.15;
const scene=new THREE.Scene(), cam=new THREE.OrthographicCamera(-1.3,1.3,1.3,-1.3,.1,20); cam.position.set(0,1.05,6); cam.lookAt(0,1.05,0);
scene.add(new THREE.HemisphereLight(0xdfeee8,0x40362b,1.25)); const key=new THREE.DirectionalLight(0xfff1dc,2.6); key.position.set(-2,3.5,4); scene.add(key); const rim=new THREE.DirectionalLight(0x7cf5d0,1.2); rim.position.set(3,2,-3); scene.add(rim);
const g=await new GLTFLoader().loadAsync('/'+char+'_anims.glb'); const model=g.scene; const root=new THREE.Group(); root.add(model); scene.add(root);
const mixer=new THREE.AnimationMixer(model); const actions={}; g.animations.forEach(a=>actions[a.name]=mixer.clipAction(a));
try{ const gw=await new GLTFLoader().loadAsync('/'+char+'_walk.glb'); const wc=gw.animations[0]; wc.name='Walk'; actions.Walk=mixer.clipAction(wc);}catch(e){console.log('nowalk',e.message);}
// normalize height from first frame of idle
actions.Combat_Stance.play(); mixer.setTime(0); model.updateMatrixWorld(true);
const box=new THREE.Box3().setFromObject(model,true), h=box.max.y-box.min.y; const sc=1.8/h; root.scale.setScalar(sc);
root.position.y=-box.min.y*sc; model.updateMatrixWorld(true);
const bn={}; model.traverse(o=>{if(o.isBone)bn[o.name]=o;});
const fa=new THREE.Vector3(),fb=new THREE.Vector3(); bn.LeftFoot.getWorldPosition(fa); bn.LeftToeBase.getWorldPosition(fb); const fwd=fb.sub(fa); const theta=Math.atan2(fwd.x,fwd.z);
root.rotation.y=yaw-theta; window.FWD=[fwd.x,fwd.z,theta]; actions.Combat_Stance.stop();
// weapons
const bones={}; model.traverse(o=>{if(o.isBone)bones[o.name]=o;});
const W=q.get('weapon')||'gladius'; const mats={steel:new THREE.MeshStandardMaterial({color:0xd7dee2,metalness:.9,roughness:.28}),bronze:new THREE.MeshStandardMaterial({color:0xb98a3e,metalness:.8,roughness:.38}),wood:new THREE.MeshStandardMaterial({color:0x6b4a26,roughness:.8})};
function weapon(kind){const gp=new THREE.Group();
 if(kind==='gladius'){const bl=new THREE.Mesh(new THREE.BoxGeometry(.05,.55,.012),mats.steel);bl.position.y=.33;gp.add(bl);const tip=new THREE.Mesh(new THREE.ConeGeometry(.0255,.1,4),mats.steel);tip.scale.z=.24;tip.position.y=.65;gp.add(tip);const gd=new THREE.Mesh(new THREE.BoxGeometry(.16,.025,.04),mats.bronze);gd.position.y=.05;gp.add(gd);const hl=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.13),mats.wood);hl.position.y=-.02;gp.add(hl);}
 else if(kind==='spear'){const sh=new THREE.Mesh(new THREE.CylinderGeometry(.014,.014,1.35),mats.wood);sh.position.y=.42;gp.add(sh);const hd=new THREE.Mesh(new THREE.ConeGeometry(.035,.28,4),mats.steel);hd.position.y=1.2;gp.add(hd);}
 else {const sh=new THREE.Mesh(new THREE.CylinderGeometry(.014,.014,1.25),mats.wood);sh.position.y=.38;gp.add(sh);for(const x of[-.07,0,.07]){const pr=new THREE.Mesh(new THREE.ConeGeometry(.012,.26,6),mats.steel);pr.position.set(x,1.1,0);gp.add(pr);}const bar=new THREE.Mesh(new THREE.BoxGeometry(.16,.015,.015),mats.steel);bar.position.y=1.0;gp.add(bar);}
 return gp;}
const wp=weapon(W); const rh=bones.RightHand; if(rh){rh.add(wp); const ws=new THREE.Vector3(); rh.getWorldScale(ws); wp.scale.setScalar(1/ws.x/sc*1);
  wp.rotation.set(+(q.get('wrx')||0),+(q.get('wry')||0),+(q.get('wrz')||0));}
// shield
const sg=new THREE.Group(); {const col=+(q.get('sc')||0x8b2f2a); const inner=new THREE.Group();
 const gold=new THREE.MeshStandardMaterial({color:0xe9c46a,metalness:.7,roughness:.4}), cm=new THREE.MeshStandardMaterial({color:col,roughness:.55,metalness:.1});
 const SW=+(q.get('sw')||.46), SH=+(q.get('sh')||.82);
 inner.add(new THREE.Mesh(new THREE.BoxGeometry(SH,SW,.05),cm));            // X = height, Y = width, Z = thickness
 for(const z of[-.028,.028]){ const rimT=new THREE.Mesh(new THREE.BoxGeometry(SH+.03,.03,.012),gold); rimT.position.set(0,SW/2,z); inner.add(rimT); const rimB=rimT.clone(); rimB.position.set(0,-SW/2,z); inner.add(rimB);
   const rl=new THREE.Mesh(new THREE.BoxGeometry(.03,SW,.012),gold); rl.position.set(SH/2,0,z); inner.add(rl); const rl2=rl.clone(); rl2.position.set(-SH/2,0,z); inner.add(rl2);
   const bs=new THREE.Mesh(new THREE.SphereGeometry(.065,16,10),gold); bs.scale.z=.45; bs.position.set(0,0,z*1.8); inner.add(bs);
   for(const sgn of[1,-1]){const wing=new THREE.Mesh(new THREE.BoxGeometry(.2,.035,.012),gold); wing.position.set(sgn*.17,0,z*1.2); inner.add(wing);} }
 inner.rotation.set(+(q.get('irx')||0),+(q.get('iry')||0),+(q.get('irz')||0)); sg.add(inner);}
const lh=bones.LeftForeArm; if(lh){lh.add(sg); const ws=new THREE.Vector3(); lh.getWorldScale(ws); sg.scale.setScalar(1/ws.x/sc); sg.rotation.set(+(q.get('srx')||0),+(q.get('sry')||0),+(q.get('srz')||0)); sg.position.set(+(q.get('spx')||0),+(q.get('spy')||0),+(q.get('spz')||0));}
window.INFO={clips:g.animations.map(a=>[a.name,a.duration])};
const refs={}; const hp=new THREE.Vector3(), pa=new THREE.Vector3(), pb=new THREE.Vector3(); const BASEYAW=root.rotation.y;
function hipsYaw(){ bn.LeftUpLeg.getWorldPosition(pa); bn.RightUpLeg.getWorldPosition(pb); return Math.atan2(pa.x-pb.x, pa.z-pb.z); }
const LOCK=+(q.get('lock')||1);
function pose(name,t){ Object.values(actions).forEach(a=>a.stop()); const a=actions[name]; a.play(); a.paused=false; mixer.setTime(0); mixer.setTime(t); root.position.set(0,root.position.y,0); root.rotation.y=BASEYAW; root.updateMatrixWorld(true); }
function place(name,t){ if(!refs[name]){ pose(name,0); bn.Hips.getWorldPosition(hp); refs[name]=[hp.x,hp.z,hipsYaw()]; }
  pose(name,t); const dy=hipsYaw()-refs[name][2]; root.rotation.y=BASEYAW-dy*LOCK; root.updateMatrixWorld(true);
  bn.Hips.getWorldPosition(hp); root.position.x+=refs[name][0]-hp.x; root.position.z+=refs[name][1]-hp.z; root.updateMatrixWorld(true); }
window.draw=(name,t)=>{ place(name,t); r.render(scene,cam); return cv.toDataURL('image/png'); };
window.bake=(name,t0,t1,n)=>{ const sh=document.createElement('canvas'); sh.width=S*n; sh.height=S; const x=sh.getContext('2d'); for(let i=0;i<n;i++){ const t=t0+(t1-t0)*(n>1?i/(n-1):0); place(name,t); r.render(scene,cam); x.drawImage(cv,i*S,0);} return sh.toDataURL('image/webp',+(q.get('wq')||.8)); };
window.DUR={walk:actions.Walk?actions.Walk.getClip().duration:1};window.READY=true;
</script>
