<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline - Robin Labs</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<style>
  :root{--bg:#060803;--ink:#f4f7ee;--dim:#93a382;--lime:#dce905}
  *{box-sizing:border-box} body{margin:0}
  .w{min-height:100vh;background:radial-gradient(70% 60% at 50% 20%,rgba(220,233,5,.08),transparent 60%),var(--bg);
    color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;
    text-align:center;padding:32px;-webkit-font-smoothing:antialiased}
  img{width:76px;height:76px;object-fit:contain;margin:0 auto 18px}
  h1{font-size:1.7rem;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
  p{color:var(--dim);max-width:36ch;margin:0 auto 22px;line-height:1.5}
  a{display:inline-block;background:var(--lime);color:#0a0e05;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:12px}
</style>
</head>
<body>
<div class="w"><div>
  <img src="assets/logo-mark.png" alt="Robin Labs" onerror="this.style.display='none'" />
  <h1>You are offline</h1>
  <p>Robin Labs needs a connection to reach the chain. Check your internet and try again.</p>
  <a href="/" onclick="location.reload();return false;">Retry</a>
</div></div>
</body>
</html>
