<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEX Voter - Token Vote Bot</title>
<style>
:root{
  --lime:#C6FF00; --lime-dim:#8FBF00; --lime-glow:rgba(198,255,0,.35);
  --black:#060806; --panel:#0d110c; --red:#FF3B3B; --green:#00E676;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--black);font-family:var(--mono);color:var(--lime)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
#wrap{width:100%;height:100%;max-width:800px;padding:20px;overflow-y:auto}
.container{max-width:600px;margin:0 auto}
h1{font-size:32px;margin-bottom:30px;text-align:center;text-shadow:0 0 16px var(--lime-glow)}
.form-group{margin-bottom:24px}
label{display:block;font-size:11px;letter-spacing:.1em;color:var(--lime-dim);margin-bottom:8px;text-transform:uppercase}
input,select{width:100%;padding:12px;font-family:var(--mono);font-size:13px;background:rgba(13,17,12,.8);
  border:1px solid rgba(198,255,0,.35);color:var(--lime);outline:0;transition:border-color .2s}
input:focus,select:focus{border-color:var(--lime)}
.input-group{display:flex;gap:12px}
.input-group input{flex:1}
.input-group input:nth-child(2){flex:0 0 100px}
.platform-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.platform-btn{padding:16px;border:1px solid rgba(198,255,0,.35);background:rgba(13,17,12,.8);
  color:var(--lime);font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .2s;
  letter-spacing:.08em;text-transform:uppercase}
.platform-btn:hover{border-color:var(--lime);box-shadow:0 0 12px var(--lime-glow)}
.platform-btn.active{background:var(--lime);color:var(--black);box-shadow:0 0 20px var(--lime-glow)}
.platform-btn:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:24px;padding:16px;border:1px solid rgba(198,255,0,.35);background:rgba(13,17,12,.5);
  font-size:11px;line-height:1.6}
.status-item{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.status-icon{width:12px;height:12px;border-radius:50%;display:inline-block}
.status-icon.pending{background:#FFB800;animation:pulse 1s infinite}
.status-icon.done{background:var(--green)}
.status-icon.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.info{font-size:9px;color:var(--lime-dim);margin-top:12px;line-height:1.5;opacity:.7}
.vote-count{font-size:18px;font-weight:700;color:var(--green);text-align:center;margin:20px 0}
</style>
</head>
<body>
<div id="wrap">
  <div class="container">
    <h1>DEX VOTER</h1>

    <div class="form-group">
      <label>Contract Address</label>
      <input type="text" id="contractInput" placeholder="0x..." value="0x">
    </div>

    <div class="form-group">
      <label>Token Name</label>
      <input type="text" id="tokenInput" placeholder="e.g., TEST, NOMO">
    </div>

    <div class="form-group">
      <label>Number of Votes</label>
      <input type="number" id="votesInput" placeholder="1" value="1" min="1" max="9999">
    </div>

    <div class="form-group">
      <label>Select Platform to Vote</label>
      <div class="platform-group">
        <button class="platform-btn" data-platform="dex-screamer" id="btn-dex-screamer">
          🚀 DEX Screamer<br><small>Rockets</small>
        </button>
        <button class="platform-btn" data-platform="dex-tools" id="btn-dex-tools">
          🔧 DEX Tools<br><small>Votes</small>
        </button>
        <button class="platform-btn" data-platform="coingecko" id="btn-coingecko">
          🦎 CoinGecko<br><small>Stars</small>
        </button>
        <button class="platform-btn" data-platform="all" id="btn-all" style="grid-column:1/-1">
          📤 Vote All Platforms
        </button>
      </div>
    </div>

    <div class="vote-count" id="voteCount" style="display:none"></div>

    <div class="status" id="status" style="display:none"></div>

    <div class="info">
      <strong>ℹ Test Mode:</strong> This voting bot uses a test token. Contract addresses starting with 0x will be simulated.<br>
      Each vote increments the platform count. Real voting would require platform API integration.<br>
      <strong>Platforms:</strong> Dex Screamer (rockets), Dex Tools (votes), CoinGecko (stars)
    </div>
  </div>
</div>

<script>
const contractInput = document.getElementById('contractInput');
const tokenInput = document.getElementById('tokenInput');
const votesInput = document.getElementById('votesInput');
const statusDiv = document.getElementById('status');
const voteCountDiv = document.getElementById('voteCount');

const platforms = {
  'dex-screamer': { name: 'DEX Screamer', icon: '🚀', votes: 0 },
  'dex-tools': { name: 'DEX Tools', icon: '🔧', votes: 0 },
  'coingecko': { name: 'CoinGecko', icon: '🦎', votes: 0 }
};

function validateInput() {
  const contract = contractInput.value.trim();
  const token = tokenInput.value.trim();
  const votes = parseInt(votesInput.value);

  if (!contract || !contract.startsWith('0x')) {
    alert('Please enter a valid contract address (starting with 0x)');
    return false;
  }
  if (!token) {
    alert('Please enter a token name');
    return false;
  }
  if (!votes || votes < 1) {
    alert('Please enter a valid number of votes');
    return false;
  }
  return { contract, token, votes };
}

async function vote(platform) {
  const input = validateInput();
  if (!input) return;

  statusDiv.style.display = 'block';
  statusDiv.innerHTML = '';

  if (platform === 'all') {
    voteCountDiv.style.display = 'block';
    voteCountDiv.textContent = `Voting ${input.votes} times on all platforms...`;

    for (const [key, platformData] of Object.entries(platforms)) {
      await votePlatform(key, input.contract, input.token, input.votes);
    }
  } else {
    await votePlatform(platform, input.contract, input.token, input.votes);
  }

  updateStatus();
  disableButtons(false);
}

async function votePlatform(platform, contract, token, votes) {
  const platformData = platforms[platform];
  const btn = document.getElementById(`btn-${platform}`);

  btn.classList.add('active');
  btn.disabled = true;

  const statusItem = document.createElement('div');
  statusItem.className = 'status-item';
  statusItem.innerHTML = `<span class="status-icon pending"></span>${platformData.name}: Voting...`;
  statusDiv.appendChild(statusItem);

  // Simulate vote delay
  await new Promise(resolve => setTimeout(resolve, 800 + Math.random() * 400));

  platformData.votes += votes;

  statusItem.classList.remove('pending');
  statusItem.innerHTML = `<span class="status-icon done"></span>${platformData.name}: +${votes} votes (Total: ${platformData.votes})`;

  btn.classList.remove('active');
  btn.disabled = false;
}

function updateStatus() {
  let total = 0;
  let html = '<strong>Vote Summary:</strong><br>';
  for (const [key, data] of Object.entries(platforms)) {
    html += `${data.icon} ${data.name}: ${data.votes} votes<br>`;
    total += data.votes;
  }
  html += `<br><strong>Total Votes: ${total}</strong>`;
  statusDiv.innerHTML = html;
  voteCountDiv.style.display = 'none';
}

function disableButtons(disable) {
  document.querySelectorAll('.platform-btn').forEach(btn => {
    btn.disabled = disable;
  });
}

// Event listeners
document.querySelectorAll('.platform-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    disableButtons(true);
    vote(btn.dataset.platform);
  });
});

votesInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('btn-all').click();
  }
});
</script>
</body>
</html>
